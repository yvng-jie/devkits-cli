name: '✨ New command'
description: Propose a new CLI command for devkits-cli (read the admission checklist first)
title: '[Feature] `devkits-cli <command>` — '
labels: ['enhancement']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new command! Before you continue, please read the
        [command admission checklist](https://github.com/yvng-jie/devkits-cli/blob/main/CONTRIBUTING.md#command-admission-checklist).

        This project deliberately stays small. A command that duplicates `jq`, `uuidgen`,
        `date`, `shasum`, `bc` or `exiftool`, or that needs network access, will be declined.
        That is not a judgement on the idea — it is what keeps the tool trustworthy.

  - type: input
    id: command_name
    attributes:
      label: Command name
      description: What should the command be called?
      placeholder: e.g. hmac, password-strength, keygen
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What does this command do?
      placeholder: e.g. Verify a JWT signature without leaving the terminal
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Why existing alternatives are not enough
      description: |
        Which offline tool or OS built-in solves this today (`jq`, `uuidgen`, `date`,
        `shasum`, `openssl`, …), and why is it insufficient for a privacy-sensitive workflow?
      placeholder: |
        `openssl` can do this, but the incantation is long enough that people paste
        secrets into web tools instead. This makes the safe path the easy path.
    validations:
      required: true

  - type: textarea
    id: usage
    attributes:
      label: Usage examples
      description: Show how the command should work
      placeholder: |
        devkits-cli hmac "message" --key secret
        devkits-cli hmac --key secret < file.txt
        devkits-cli hmac "message" --key secret --json
      render: bash
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Options / Flags (optional)
      description: Any flags the command should support?
      placeholder: |
        --algo, -a      Hash algorithm (default: sha256)
        --key, -k       HMAC key
        --json          JSON output
      render: text

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which group should this command appear under in `devkits-cli help`?
      options:
        - 'crypto — Security & Crypto'
        - 'encoding — Encoding'
        - 'utility — Utilities'
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Admission checklist
      description: All of these are required for a new command to be accepted
      options:
        - label: Works fully offline — no network calls
          required: true
        - label: Supports `--json` with a stable shape
          required: true
        - label: Reads piped stdin when no argument is given
          required: true
        - label: Ships with unit tests
          required: true
        - label: Adds flag metadata to `FLAGS` in `src/commands/completion.ts`
          required: true
